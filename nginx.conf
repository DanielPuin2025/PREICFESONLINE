# Configuración Nginx para PRE-ICFES ONLINE
# Copiar a: /etc/nginx/sites-available/preicfes
# Activar con: sudo ln -s /etc/nginx/sites-available/preicfes /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name programamega.com www.programamega.com;

    # Logs
    access_log /var/log/nginx/preicfes-access.log;
    error_log /var/log/nginx/preicfes-error.log;

    # Tamaño máximo de archivos (para imágenes)
    client_max_body_size 10M;

    # Proxy a Node.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Cache para archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
